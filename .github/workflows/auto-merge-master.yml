name: Auto-merge master to JF-Pieper-Modifications

on:
  push:
    branches:
      - master  # Trigger on every push/merge to master
  workflow_dispatch: {} # Allow manual triggering

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure git
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
    
    - name: Switch to JF-Pieper-Modifications branch
      run: |
        git checkout JF-Pieper-Modifications

    - name: Attempt automatic merge from master
      id: auto_merge
      run: |
        echo "Attempting automatic merge from master..."
        if git merge origin/master --no-edit; then
          echo "merge_success=true" >> $GITHUB_OUTPUT
          echo "Automatic merge successful"
        else
          echo "merge_success=false" >> $GITHUB_OUTPUT
          echo "Merge conflicts detected"
        fi
    
    - name: Resolve conflicts with protected-file policy
      if: steps.auto_merge.outputs.merge_success == 'false'
      run: |
        # Shared code files carrying JF-Pieper modifications. A conflict here
        # needs human review: taking either side wholesale would lose upstream
        # fixes or our modifications, and likely break the build. Abort so the
        # failure issue gets filed.
        MANUAL="src/graphics/Screen.cpp
        src/mesh/NodeDB.cpp
        src/modules/ExternalNotificationModule.cpp
        src/modules/ExternalNotificationModule.h
        src/modules/DetectionSensorModule.cpp"

        # Fork-owned files: our version always wins. Backed by merge=ours
        # entries in .gitattributes; listed again here as a safety net.
        OURS="src/modules/AlertRingtones.h
        src/mesh/generated/meshtastic/rtttl.pb.h
        src/graphics/draw/PagerMessageRenderer.h
        src/graphics/draw/PagerMessageRenderer.cpp
        variants/nrf52840/heltec_mesh_node_t114/variant.h
        README.md
        .github/copilot-instructions.md
        .gitattributes"

        is_in() { echo "$2" | sed 's/^ *//' | grep -qxF "$1"; }

        conflicts=$(git diff --name-only --diff-filter=U)
        echo "Conflicted files:"
        echo "$conflicts"

        blocked=""
        for f in $conflicts; do
          if is_in "$f" "$MANUAL"; then
            blocked="$blocked $f"
          fi
        done

        if [ -n "$blocked" ]; then
          echo "::error::Conflicts touch protected JF-Pieper files:$blocked - manual merge required"
          git merge --abort
          exit 1
        fi

        for f in $conflicts; do
          if is_in "$f" "$OURS"; then
            echo "Keeping fork version of $f"
            git checkout --ours -- "$f" 2>/dev/null || git rm -f --quiet -- "$f"
          else
            echo "Taking master version of $f"
            git checkout --theirs -- "$f" 2>/dev/null || git rm -f --quiet -- "$f"
          fi
          git add -A -- "$f"
        done

        git commit --no-edit

    - name: Verify JF-Pieper modifications are preserved
      run: |
        fail=0
        check() {
          if grep -qF "$2" "$1" 2>/dev/null; then
            echo "OK   $1: $2"
          else
            echo "MISS $1: $2"
            fail=1
          fi
        }
        check src/graphics/Screen.cpp "FF Kladow pager: restrict UI"
        check src/graphics/Screen.cpp "HELTEC_MESH_NODE_T114"
        check src/graphics/Screen.cpp "FF Kladow pager: single-message frame"
        check src/graphics/draw/PagerMessageRenderer.cpp "FF Kladow pager: single-message frame"
        check src/modules/ExternalNotificationModule.cpp "getRingtoneForAlertType"
        check src/modules/ExternalNotificationModule.h "AlertRingtones.h"
        check src/modules/AlertRingtones.h "detectAlertType"
        check src/mesh/NodeDB.cpp "T114 pager: nag_timeout"
        check src/modules/DetectionSensorModule.cpp "kDetectionChannelIndex"
        check src/mesh/generated/meshtastic/rtttl.pb.h "alarm_ringtone"
        check "variants/nrf52840/heltec_mesh_node_t114/variant.h" "PIN_BUZZER (0 + 44)"
        if [ "$fail" -ne 0 ]; then
          echo "::error::JF-Pieper modifications missing after merge"
          exit 1
        fi
    
    - name: Push merged changes
      run: |
        git push origin JF-Pieper-Modifications
    
    - name: Create summary comment
      run: |
        echo "## Auto-merge Summary" >> $GITHUB_STEP_SUMMARY
        echo "Successfully merged master branch into JF-Pieper-Modifications" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ JF-Pieper modifications verified (buzzer, screen, NodeDB, detection sensor, variant)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ All other changes from master merged" >> $GITHUB_STEP_SUMMARY
        echo "- 📝 Changes pushed to JF-Pieper-Modifications branch" >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: auto-merge
    if: failure()
    
    steps:
    - name: Create issue on merge failure
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const title = '🚨 Auto-merge failed: master → JF-Pieper-Modifications';
          const body = `
          The automatic merge from master to JF-Pieper-Modifications branch failed.
          
          **Possible causes:**
          - Conflicts in protected shared files (Screen.cpp, NodeDB.cpp, ExternalNotificationModule.*, DetectionSensorModule.cpp) - these are never auto-resolved
          - Other complex merge conflicts requiring manual resolution

          **Manual action required:**
          1. Checkout the JF-Pieper-Modifications branch
          2. Manually merge master: \`git merge master\`
          3. Resolve conflicts, ensuring all JF-Pieper modifications below are preserved
          4. Push the resolved merge

          **JF-Pieper modifications to preserve:**
          - Prefix-based alert ringtones (ExternalNotificationModule.cpp/.h + AlertRingtones.h; silent T100E:ACK)
          - HELTEC_MESH_NODE_T114 screen restriction via hiddenFrames in Screen.cpp setFrames()
          - Pager single-message frame (src/graphics/draw/PagerMessageRenderer.{h,cpp} + frame swap in Screen.cpp setFrames())
          - NodeDB.cpp: 60s nag_timeout enforcement for T114 pager
          - DetectionSensorModule.cpp: channel index 8 pinning
          - variants/nrf52840/heltec_mesh_node_t114/variant.h: buzzer on pin 44 (P1.12)
          
          Run ID: ${context.runId}
          `;
          
          // Check if issue already exists
          const existingIssues = await github.rest.issues.listForRepo({
            owner,
            repo,
            state: 'open',
            labels: 'auto-merge-failure'
          });
          
          const existingIssue = existingIssues.data.find(issue => 
            issue.title.includes('Auto-merge failed: master → JF-Pieper-Modifications')
          );
          
          if (existingIssue) {
            // Update existing issue
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existingIssue.number,
              body: `Another auto-merge attempt failed.\n\n${body}`
            });
          } else {
            // Create new issue
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['auto-merge-failure', 'needs-attention']
            });
          }
