name: Auto-build Heltec T114 after merge

on:
  push:
    branches:
      - JF-Pieper-Modifications  # Trigger on every push/merge to your branch
  workflow_dispatch: {} # Allow manual triggering

jobs:
  build-t114:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: platformio-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-
            
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          
      - name: Setup build environment
        run: |
          echo "Setting up build environment for Heltec T114..."
          # Create bin directory if it doesn't exist
          mkdir -p bin
          
      - name: Verify JF-Pieper modifications are included
        run: |
          echo "🔍 Verifying JF-Pieper modifications in build..."
          if grep -q "HELTEC_MESH_NODE_T114" src/graphics/Screen.cpp; then
            echo "✅ HELTEC_MESH_NODE_T114 conditional compilation found"
          else
            echo "❌ HELTEC_MESH_NODE_T114 modifications missing!"
            exit 1
          fi
          
          if grep -q "Only show the debug info settings screen" src/graphics/Screen.cpp; then
            echo "✅ Simplified screen display modifications found"
          else
            echo "❌ Screen simplification modifications missing!"
            exit 1
          fi
          
          echo "✅ All JF-Pieper modifications verified in source code"
          
      - name: Build Heltec T114 firmware
        run: |
          echo "🔨 Building Heltec T114 firmware with JF-Pieper modifications..."
          
          # Run PlatformIO build for T114
          pio run --environment heltec-mesh-node-t114
          
          # Create release directory
          mkdir -p release
          
          # Copy build artifacts to release directory
          if [ -f ".pio/build/heltec-mesh-node-t114/firmware.hex" ]; then
            cp .pio/build/heltec-mesh-node-t114/firmware.hex release/firmware-heltec-mesh-node-t114-${{ github.sha }}.hex
            echo "✅ Created firmware.hex"
          fi
          
          if [ -f ".pio/build/heltec-mesh-node-t114/firmware.uf2" ]; then
            cp .pio/build/heltec-mesh-node-t114/firmware.uf2 release/firmware-heltec-mesh-node-t114-${{ github.sha }}.uf2
            echo "✅ Created firmware.uf2"
          fi
          
          if [ -f ".pio/build/heltec-mesh-node-t114/firmware.elf" ]; then
            cp .pio/build/heltec-mesh-node-t114/firmware.elf release/firmware-heltec-mesh-node-t114-${{ github.sha }}.elf
            echo "✅ Created firmware.elf"
          fi
          
          # Create zip package
          cd release
          zip firmware-heltec-mesh-node-t114-${{ github.sha }}.zip firmware-heltec-mesh-node-t114-${{ github.sha }}.*
          echo "✅ Created firmware.zip package"
          
          # List all created files
          echo "📦 Build artifacts created:"
          ls -la
          
      - name: Generate GPL-3.0 compliance documentation
        run: |
          echo "📋 Generating GPL-3.0 compliance documentation..."
          
          # Create compliance notice file
          cat > release/GPL-3.0-COMPLIANCE-NOTICE.txt << 'EOF'
          GPL-3.0 COMPLIANCE NOTICE
          =========================
          
          License & Notices: This distribution contains modified Meshtastic firmware (GPL-3.0). 
          Modified by JF-Pieper on $(date +%Y-%m-%d). 
          Original source: https://github.com/meshtastic/firmware. 
          See LICENSE file for full GPL-3.0 terms.
          
          Corresponding Source: Exact source for this binary: commit ${{ github.sha }} on branch JF-Pieper-Modifications at https://github.com/alphaO4/firmware/commit/${{ github.sha }}. 
          Build configuration included in repository (platformio.ini, .github/workflows/). 
          To rebuild: pip install platformio && pio run --environment heltec-mesh-node-t114.
          
          Installation Information (GPLv3 §6): For Heltec T114 devices: Enter bootloader mode (double-tap reset), drag .uf2 file to mounted drive, or use programming tools with .hex file. 
          No cryptographic signatures prevent user installation of modified firmware. 
          Device owners can install their own builds using standard nRF52840 programming methods.
          
          No Additional Restrictions: No patent claims, technical protection measures, or license terms beyond GPL-3.0 are imposed on this distribution.
          
          Trademarks: This modified firmware is based on Meshtastic but is not affiliated with or endorsed by Meshtastic LLC. 
          "Meshtastic" is a trademark of Meshtastic LLC. 
          Use of Meshtastic trademark follows fair use for compatibility description only.
          
          Source Archive: https://github.com/alphaO4/firmware/archive/refs/heads/JF-Pieper-Modifications.tar.gz
          Build Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Build Environment: Ubuntu $(lsb_release -rs), PlatformIO $(pio --version), Python $(python3 --version)
          EOF
          
          # Create installation instructions
          cat > release/INSTALLATION-INSTRUCTIONS.txt << 'EOF'
          HELTEC T114 INSTALLATION INSTRUCTIONS
          ====================================
          
          Method 1: UF2 Drag-and-Drop (Recommended)
          1. Connect T114 device via USB cable
          2. Double-tap the reset button to enter bootloader mode
          3. Device appears as USB mass storage device
          4. Drag firmware-heltec-mesh-node-t114-${{ github.sha }}.uf2 to the device
          5. Device automatically reboots with new firmware
          
          Method 2: Programming Tool
          1. Install programming software (e.g., nRF Connect Programmer)
          2. Connect T114 device via USB or SWD
          3. Flash firmware-heltec-mesh-node-t114-${{ github.sha }}.hex
          
          JF-Pieper Modifications Included:
          - Simplified display (messages + settings only)
          - Removed pages: clock, nodes, WiFi, debug log  
          - Debug shows "No GPS present" when applicable
          - Protected by HELTEC_MESH_NODE_T114 conditional compilation
          
          For questions or issues: https://github.com/alphaO4/firmware/issues
          EOF
          
          echo "✅ Generated compliance documentation"
          
      - name: Create exact source tarball for this build
        run: |
          mkdir -p release
          git archive --format=tar.gz --output "release/source-${{ github.sha }}.tar.gz" ${{ github.sha }}
          # If you use submodules, vendor them too:
          if [ -f .gitmodules ]; then
            mkdir -p release/source-${{ github.sha }}-submodules
            git submodule foreach --recursive 'git archive --format=tar > "$toplevel/release/source-${{ github.sha }}-submodules/${name//\//_}.tar" HEAD'
          fi
          
      - name: Include LICENSE and manifest
        run: |
          cp LICENSE release/ || true
          {
            echo "Build commit: ${{ github.sha }}"
            echo "Board: heltec-mesh-node-t114"
            echo "Rebuild: pip install platformio && pio run --environment heltec-mesh-node-t114"
            echo "Artifacts:"
            ls -1 release/
          } > release/SOURCE-MANIFEST.txt
          # Generate checksums only for files, not directories
          (cd release && find . -maxdepth 1 -type f -exec sha256sum {} \; > SHA256SUMS.txt)
          
      - name: Upload T114 firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: heltec-t114-firmware-${{ github.sha }}
          path: release/*
          retention-days: 30
          
      - name: Generate release tag
        id: generate_tag
        run: |
          # Generate a timestamp-based tag for the release
          TIMESTAMP=$(date -u '+%Y%m%d-%H%M%S')
          TAG_NAME="t114-jf-pieper-${TIMESTAMP}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=Heltec T114 JF-Pieper Build ${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG_NAME}"
          
      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.generate_tag.outputs.tag_name }}"
          RELEASE_NAME="${{ steps.generate_tag.outputs.release_name }}"
          
          # Create release body in a file to handle multiline properly
          cat > release_body.md << 'EOF'
          ## 🚀 Heltec T114 Firmware - JF-Pieper Modifications
          
          **Auto-built firmware for Heltec Mesh Node T114 with custom modifications.**
          
          ### 🎯 Features Included:
          - ✅ **Simplified Display**: Shows only messages and settings screens
          - ✅ **GPS Status**: Shows "No GPS present" message when applicable  
          - ✅ **Optimized Interface**: Removed unnecessary pages (clock, nodes, WiFi, debug log)
          - ✅ **Conditional Compilation**: Protected by `HELTEC_MESH_NODE_T114` flag
          
          ### 📦 Installation Files:
          - **firmware-heltec-mesh-node-t114-${{ github.sha }}.uf2** - Drag-and-drop installation file
          - **firmware-heltec-mesh-node-t114-${{ github.sha }}.hex** - Programming tool compatible
          - **firmware-heltec-mesh-node-t114-${{ github.sha }}.elf** - Debug symbols included
          - **GPL-3.0-COMPLIANCE-NOTICE.txt** - License compliance documentation
          - **INSTALLATION-INSTRUCTIONS.txt** - Step-by-step installation guide
          
          ### 🛠️ Installation Instructions:
          
          **Method 1: UF2 Drag-and-Drop (Recommended)**
          1. Connect T114 device via USB cable
          2. Double-tap the reset button to enter bootloader mode
          3. Device appears as USB mass storage device
          4. Drag the `.uf2` file to the device
          5. Device automatically reboots with new firmware
          
          **Method 2: Programming Tool**
          1. Install nRF Connect Programmer or similar tool
          2. Connect T114 device via USB or SWD
          3. Flash the `.hex` file
          
          ### 📋 Build Information:
          - **Branch**: JF-Pieper-Modifications
          - **Commit**: ${{ github.sha }}
          - **Architecture**: nRF52840
          - **Board**: heltec-mesh-node-t114
          - **Build Date**: ${{ steps.generate_tag.outputs.tag_name }}
          - **GPL-3.0 Licensed**: Full source and compliance documentation included
          
          ### ⚖️ License & Compliance:
          This firmware is based on Meshtastic (GPL-3.0) with JF-Pieper modifications. 
          Complete source code and build instructions are available at: 
          [Commit ${{ github.sha }}](https://github.com/meshtastic/firmware/commit/${{ github.sha }})
          
          ### 🔗 Links:
          - 📖 [Installation Guide](https://github.com/alphaO4/firmware/blob/JF-Pieper-Modifications/README.md)
          - 🐛 [Report Issues](https://github.com/alphaO4/firmware/issues)
          - 📜 [GPL-3.0 License](https://github.com/alphaO4/firmware/blob/JF-Pieper-Modifications/LICENSE)
          - 🔍 [Source Archive](https://github.com/alphaO4/firmware/archive/refs/heads/JF-Pieper-Modifications.tar.gz)
          
          **Ready for deployment on Heltec T114 devices! 🎉**
          EOF
          
      - name: Fix release body (pin to exact commit in your fork)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.generate_tag.outputs.tag_name }}"
          RELEASE_NAME="${{ steps.generate_tag.outputs.release_name }}"
          
          # Fix the commit link to point to your fork instead of meshtastic
          sed -i "s|https://github.com/meshtastic/firmware/commit/${{ github.sha }}|https://github.com/alphaO4/firmware/commit/${{ github.sha }}|g" release_body.md
          # Make the source link prominent at the top:
          sed -i "1i **📦 Complete Corresponding Source (GPL-3.0): [source-${{ github.sha }}.tar.gz](./source-${{ github.sha }}.tar.gz)** - Exact source code for these binaries\n" release_body.md
          
          # Create the release using GitHub CLI
          gh release create "${TAG_NAME}" \
            --title "${RELEASE_NAME}" \
            --notes-file release_body.md \
            --target "JF-Pieper-Modifications"
          
          # Get the release URL and set outputs
          RELEASE_URL=$(gh release view "${TAG_NAME}" --json url --jq '.url')
          echo "html_url=${RELEASE_URL}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          
          echo "✅ Release created: ${RELEASE_URL}"
          
      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📎 Uploading release assets..."
          
          TAG_NAME="${{ steps.generate_tag.outputs.tag_name }}"
          
          # Navigate to release directory
          cd release
          
          # Upload firmware files using GitHub CLI
          echo "Uploading firmware files..."
          
          if [ -f "firmware-heltec-mesh-node-t114-${{ github.sha }}.uf2" ]; then
            gh release upload "${TAG_NAME}" "firmware-heltec-mesh-node-t114-${{ github.sha }}.uf2"
            echo "✅ Uploaded .uf2 file"
          fi
          
          if [ -f "firmware-heltec-mesh-node-t114-${{ github.sha }}.hex" ]; then
            gh release upload "${TAG_NAME}" "firmware-heltec-mesh-node-t114-${{ github.sha }}.hex"
            echo "✅ Uploaded .hex file"
          fi
          
          if [ -f "firmware-heltec-mesh-node-t114-${{ github.sha }}.elf" ]; then
            gh release upload "${TAG_NAME}" "firmware-heltec-mesh-node-t114-${{ github.sha }}.elf"
            echo "✅ Uploaded .elf file"
          fi
          
          if [ -f "firmware-heltec-mesh-node-t114-${{ github.sha }}.zip" ]; then
            gh release upload "${TAG_NAME}" "firmware-heltec-mesh-node-t114-${{ github.sha }}.zip"
            echo "✅ Uploaded .zip package"
          fi
          
          # Upload documentation files
          echo "Uploading documentation..."
          gh release upload "${TAG_NAME}" "GPL-3.0-COMPLIANCE-NOTICE.txt"
          gh release upload "${TAG_NAME}" "INSTALLATION-INSTRUCTIONS.txt"
          echo "✅ Uploaded documentation files"
          
          echo "🎉 All release assets uploaded successfully!"
          
          # List all uploaded assets
          echo "📦 Release assets:"
          gh release view "${TAG_NAME}" --json assets --jq '.assets[].name'
          
      - name: Upload source & license assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.generate_tag.outputs.tag_name }}"
          cd release
          
          echo "📎 Uploading GPL-3.0 compliance assets..."
          
          # Upload exact source tarball
          if [ -f "source-${{ github.sha }}.tar.gz" ]; then
            gh release upload "${TAG_NAME}" "source-${{ github.sha }}.tar.gz"
            echo "✅ Uploaded exact source tarball"
          fi
          
          # Upload submodules if they exist
          if [ -d "source-${{ github.sha }}-submodules" ] && [ "$(ls -A source-${{ github.sha }}-submodules)" ]; then
            gh release upload "${TAG_NAME}" source-${{ github.sha }}-submodules/*
            echo "✅ Uploaded submodule source archives"
          else
            echo "📝 No submodules found - skipping submodule upload"
          fi
          
          # Upload checksums and manifest
          gh release upload "${TAG_NAME}" "SHA256SUMS.txt"
          gh release upload "${TAG_NAME}" "SOURCE-MANIFEST.txt"
          echo "✅ Uploaded checksums and source manifest"
          
          # Upload LICENSE file if it exists
          if [ -f "LICENSE" ]; then
            gh release upload "${TAG_NAME}" "LICENSE"
            echo "✅ Uploaded LICENSE file"
          elif [ -f "../LICENSE" ]; then
            gh release upload "${TAG_NAME}" "../LICENSE"
            echo "✅ Uploaded LICENSE file from repository root"
          fi
          
          echo "✅ All GPL-3.0 compliance assets uploaded!"
          
          # List final assets
          echo "📦 Complete release assets:"
          gh release view "${TAG_NAME}" --json assets --jq '.assets[].name'
          
      - name: Create build summary
        run: |
          echo "## 🚀 Heltec T114 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "Built firmware for Heltec T114 with JF-Pieper modifications" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Features:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Simplified display (messages + settings only)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 'No GPS present' message in debug info" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Removed unnecessary pages (clock, nodes, WiFi, debug log)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Info:" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** JF-Pieper-Modifications" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** nRF52840" >> $GITHUB_STEP_SUMMARY
          echo "- **Board:** heltec-mesh-node-t114" >> $GITHUB_STEP_SUMMARY
          echo "- **Build artifacts:** heltec-t114-firmware-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release tag:** ${{ steps.generate_tag.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎉 Release Created:" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **Release:** [${{ steps.generate_tag.outputs.release_name }}](${{ steps.create_release.outputs.html_url }})" >> $GITHUB_STEP_SUMMARY
          echo "- 📥 **Download:** [Direct download](${{ steps.create_release.outputs.html_url }})" >> $GITHUB_STEP_SUMMARY
          echo "- 🚀 **Ready for deployment:** All firmware files and documentation included" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GPL-3.0 Compliance:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Compliance documentation included in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- 📄 GPL-3.0-COMPLIANCE-NOTICE.txt" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 INSTALLATION-INSTRUCTIONS.txt" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 Source: [commit ${{ github.sha }}](https://github.com/alphaO4/firmware/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Source archive: [Download](https://github.com/alphaO4/firmware/archive/refs/heads/JF-Pieper-Modifications.tar.gz)" >> $GITHUB_STEP_SUMMARY
          
      - name: Comment on commit (if available)
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            
            const body = `🔧 **Auto-built Heltec T114 firmware**
            
            ✅ Successfully built firmware with JF-Pieper modifications
            📦 Artifacts: \`heltec-t114-firmware-${sha}\`
            
            **🎉 Release Created:**
            - 📦 **Release:** [${{ steps.generate_tag.outputs.release_name }}](${{ steps.create_release.outputs.html_url }})
            - 📥 **Direct Download:** [Get firmware files](${{ steps.create_release.outputs.html_url }})
            - 🏷️ **Tag:** \`${{ steps.generate_tag.outputs.tag_name }}\`
            
            **Features included:**
            - Simplified display (messages + settings only)  
            - "No GPS present" message in debug info
            - Removed unnecessary pages for T114 device
            
            **Installation Files:**
            - 🔧 \`.uf2\` - Drag-and-drop installation
            - 🔧 \`.hex\` - Programming tool compatible  
            - 🔧 \`.elf\` - Debug symbols included
            - 📋 GPL-3.0 compliance documentation
            - 📖 Installation instructions
            
            **GPL-3.0 Compliance:**
            - 📄 Compliance documentation included
            - 🔗 Source: [commit ${sha}](https://github.com/alphaO4/firmware/commit/${sha})
            - 📦 Source archive: [Download](https://github.com/alphaO4/firmware/archive/refs/heads/JF-Pieper-Modifications.tar.gz)
            
            **Ready for deployment!** 🚀`;
            
            try {
              await github.rest.repos.createCommitComment({
                owner,
                repo,
                commit_sha: sha,
                body
              });
            } catch (error) {
              console.log('Could not create commit comment:', error.message);
            }

  notify-build-failure:
    runs-on: ubuntu-latest
    needs: build-t114
    if: failure()
    
    steps:
    - name: Create issue on build failure
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const title = '🚨 Heltec T114 build failed on JF-Pieper-Modifications';
          const body = `
          The automatic Heltec T114 build failed after a merge to JF-Pieper-Modifications.
          
          **Failure Details:**
          - Branch: JF-Pieper-Modifications
          - Commit: ${context.sha}
          - Run ID: ${context.runId}
          - Workflow: Auto-build Heltec T114
          
          **Possible causes:**
          - Build environment issues
          - Missing dependencies
          - Source code compilation errors
          - JF-Pieper modifications may have been corrupted
          - GitHub release creation failure
          - Asset upload issues
          
          **Manual verification needed:**
          1. Check that HELTEC_MESH_NODE_T114 conditional compilation is present
          2. Verify Screen.cpp modifications are intact
          3. Review build logs for specific errors
          4. Test local build: \`pio run --environment heltec-mesh-node-t114\`
          5. Check GitHub token permissions for release creation
          6. Verify release tag generation and asset uploads
          
          **Auto-build will retry on next merge.**
          `;
          
          // Check if issue already exists
          const existingIssues = await github.rest.issues.listForRepo({
            owner,
            repo,
            state: 'open',
            labels: 't114-build-failure'
          });
          
          const existingIssue = existingIssues.data.find(issue => 
            issue.title.includes('Heltec T114 build failed')
          );
          
          if (existingIssue) {
            // Update existing issue
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existingIssue.number,
              body: `Another T114 build failure occurred.\n\n${body}`
            });
          } else {
            // Create new issue
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['t114-build-failure', 'needs-attention', 'JF-Pieper-Modifications']
            });
          }

  auto-fix-with-copilot:
    runs-on: ubuntu-latest
    needs: build-t114
    if: failure()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Analyze build failure and request Copilot fix
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          
          // Get the failed workflow run details
          const runId = context.runId;
          const workflowRun = await github.rest.actions.getWorkflowRun({
            owner,
            repo,
            run_id: runId
          });
          
          // Get the job logs to understand the failure
          const jobs = await github.rest.actions.listJobsForWorkflowRun({
            owner,
            repo,
            run_id: runId
          });
          
          const failedJob = jobs.data.jobs.find(job => job.conclusion === 'failure');
          
          if (!failedJob) {
            console.log('No failed job found');
            return;
          }
          
          // Create a detailed problem statement for Copilot
          const problemStatement = `
          **Automatic Build Failure Fix Request**
          
          The Heltec T114 auto-build workflow failed on the JF-Pieper-Modifications branch.
          
          **Failure Details:**
          - Branch: JF-Pieper-Modifications
          - Commit: ${context.sha}
          - Failed Job: ${failedJob.name}
          - Workflow Run: ${context.runId}
          - Job URL: ${failedJob.html_url}
          
          **Task for Copilot:**
          Please analyze the build failure and implement a fix. Common issues include:
          
          1. **Build Environment Issues:**
             - Missing dependencies in platformio.ini
             - Incorrect PlatformIO environment configuration
             - Missing board variant files
          
          2. **Source Code Compilation Errors:**
             - Syntax errors in C++ code
             - Missing include files
             - Undefined references or symbols
             - Conditional compilation issues (#ifdef HELTEC_MESH_NODE_T114)
          
          3. **JF-Pieper Modifications Issues:**
             - Verify HELTEC_MESH_NODE_T114 conditional compilation in src/graphics/Screen.cpp
             - Ensure "Only show the debug info settings screen" modifications are intact
             - Check for conflicts with upstream Meshtastic changes
          
          4. **GitHub Actions Workflow Issues:**
             - Token permissions for release creation
             - Asset upload failures
             - Environment variable configuration
          
          **Expected Fix:**
          - Identify the root cause of the build failure
          - Implement the minimal necessary changes to fix the issue
          - Preserve all JF-Pieper modifications (simplified display, conditional compilation)
          - Ensure the fix maintains GPL-3.0 compliance
          - Test that the fix allows successful compilation for heltec-mesh-node-t114
          
          **Files to examine:**
          - .github/workflows/auto-build-t114.yml (this workflow)
          - src/graphics/Screen.cpp (JF-Pieper modifications)
          - platformio.ini (build configuration)
          - variants/nrf52840/heltec_mesh_node_t114/ (board variant files)
          - Any other files mentioned in the error logs
          
          Please create a pull request with the fix targeting the JF-Pieper-Modifications branch.
          `;
          
          // Check if Copilot is already assigned to an existing issue
          const existingIssues = await github.rest.issues.listForRepo({
            owner,
            repo,
            state: 'open',
            labels: 'copilot-fix-request',
            assignee: 'github-copilot[bot]'
          });
          
          const existingCopilotIssue = existingIssues.data.find(issue => 
            issue.title.includes('Auto-fix T114 build failure')
          );
          
          if (existingCopilotIssue) {
            console.log('Copilot is already working on a fix. Adding update to existing issue.');
            
            // Add a comment to the existing issue
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existingCopilotIssue.number,
              body: `**New Build Failure Detected**\n\nAnother build failure occurred. Please also address this failure:\n\n${problemStatement}`
            });
            
          } else {
            console.log('Creating new issue and assigning to GitHub Copilot for automatic fix.');
            
            // Create a new issue and assign to GitHub Copilot coding agent
            const issue = await github.rest.issues.create({
              owner,
              repo,
              title: `🤖 Auto-fix T114 build failure - ${new Date().toISOString().split('T')[0]}`,
              body: problemStatement,
              labels: [
                'copilot-fix-request', 
                't114-build-failure', 
                'JF-Pieper-Modifications',
                'automated-fix'
              ]
            });
            
            console.log(`Created issue #${issue.data.number} for Copilot to fix`);
            
            // Assign GitHub Copilot to the issue to trigger automatic fix
            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: issue.data.number,
                assignees: ['github-copilot[bot]']
              });
              console.log('✅ Assigned GitHub Copilot to automatically fix the build failure');
            } catch (error) {
              console.log('Note: Could not assign Copilot directly. Copilot will still see the issue due to labels.');
            }
            
            // Add a comment to trigger Copilot coding agent
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.data.number,
              body: `@github-copilot please analyze the build failure and create a pull request with a fix for the JF-Pieper-Modifications branch.
              
              Focus on:
              1. Identifying compilation errors or workflow issues
              2. Preserving JF-Pieper modifications (HELTEC_MESH_NODE_T114 conditional compilation)
              3. Ensuring successful build for heltec-mesh-node-t114 environment
              4. Maintaining GPL-3.0 compliance
              
              Please create a PR targeting the JF-Pieper-Modifications branch with the fix.`
            });
            
            console.log('✅ Triggered GitHub Copilot coding agent for automatic fix');
          }
          
    - name: Report auto-fix status
      if: always()
      run: |
        echo "🤖 GitHub Copilot coding agent has been notified of the build failure"
        echo "📋 A detailed issue has been created with fix instructions"
        echo "🔧 Copilot will analyze the failure and create a pull request with a fix"
        echo "⏱️  Expected response time: A few minutes to an hour"
        echo "🎯 Target branch: JF-Pieper-Modifications"
        echo ""
        echo "You can monitor progress at: https://github.com/${GITHUB_REPOSITORY}/issues?q=is%3Aopen+label%3Acopilot-fix-request"
